# Blueprint de Render para un ambiente de PRUEBAS / DEMO.
# Usa mensajería en modo sandbox: el código de verificación se muestra en pantalla.
# No compartir esta liga con candidatos reales.
services:
  - type: web
    name: crm-recluta-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: crm-recluta-db
          property: connectionString
      - key: OTP_SECRET
        generateValue: true
      - key: DELIVERY_MODE
        value: sandbox
      - key: EXPOSE_DEV_OTP
        value: "true"
      - key: APP_TIMEZONE
        value: America/Mexico_City
databases:
  - name: crm-recluta-db
    plan: free
    databaseName: crm_recluta
    user: crm
